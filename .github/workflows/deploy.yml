name: Simple Server Deploy

on:
  pull_request:
    branches:
      - main
      - production
    paths:
      - backend/**
      - web-app/**
      - admin-panel/**
      - .github/workflows/deploy.yml
  push:
    branches:
      - main
      - production
    paths:
      - backend/**
      - web-app/**
      - admin-panel/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  BACKEND_DIR: backend
  WEB_APP_DIR: web-app
  ADMIN_PANEL_DIR: admin-panel
  SERVER_APP_DIR: ${{ vars.SERVER_APP_DIR != '' && vars.SERVER_APP_DIR || '/var/www/dev.beas.in/public_html/restaurant_project_beas' }}
  PM2_APP_NAME: ${{ vars.PM2_APP_NAME != '' && vars.PM2_APP_NAME || 'restaurant-backend' }}
  WEB_PM2_APP_NAME: ${{ vars.WEB_PM2_APP_NAME != '' && vars.WEB_PM2_APP_NAME || 'restaurant-web-app' }}
  ADMIN_PM2_APP_NAME: ${{ vars.ADMIN_PM2_APP_NAME != '' && vars.ADMIN_PM2_APP_NAME || 'restaurant-admin-panel' }}
  PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL != '' && vars.PUBLIC_API_BASE_URL || 'http://192.168.1.18:7001/api' }}
  WEB_APP_PORT: ${{ vars.WEB_APP_PORT != '' && vars.WEB_APP_PORT || '7002' }}
  ADMIN_PANEL_PORT: ${{ vars.ADMIN_PANEL_PORT != '' && vars.ADMIN_PANEL_PORT || '7003' }}

jobs:
  backend-ci:
    name: Build All Apps
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restaurant_db?schema=restaurant_management
      VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL != '' && vars.PUBLIC_API_BASE_URL || 'http://192.168.1.18:7001/api' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm ci

      - name: Lint backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run lint

      - name: Typecheck backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run typecheck

      - name: Build backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run build

      - name: Install web-app dependencies
        working-directory: ${{ env.WEB_APP_DIR }}
        run: npm ci

      - name: Build web-app
        working-directory: ${{ env.WEB_APP_DIR }}
        run: npm run build

      - name: Install admin-panel dependencies
        working-directory: ${{ env.ADMIN_PANEL_DIR }}
        run: npm ci

      - name: Build admin-panel
        working-directory: ${{ env.ADMIN_PANEL_DIR }}
        run: npm run build

  deploy:
    name: Deploy All Apps To Server
    needs: backend-ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: simple-server-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.SERVER_APP_DIR }}
          BRANCH: ${{ github.ref_name }}
          PM2_APP_NAME: ${{ env.PM2_APP_NAME }}
          WEB_PM2_APP_NAME: ${{ env.WEB_PM2_APP_NAME }}
          ADMIN_PM2_APP_NAME: ${{ env.ADMIN_PM2_APP_NAME }}
          PUBLIC_API_BASE_URL: ${{ env.PUBLIC_API_BASE_URL }}
          WEB_APP_PORT: ${{ env.WEB_APP_PORT }}
          ADMIN_PANEL_PORT: ${{ env.ADMIN_PANEL_PORT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: APP_DIR,BRANCH,PM2_APP_NAME,WEB_PM2_APP_NAME,ADMIN_PM2_APP_NAME,PUBLIC_API_BASE_URL,WEB_APP_PORT,ADMIN_PANEL_PORT
          script: |
            set -e

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repo not found at $APP_DIR"
              exit 1
            fi

            if [ ! -f "$APP_DIR/shared/backend.env" ]; then
              echo "Missing env file: $APP_DIR/shared/backend.env"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git pull --ff-only origin "$BRANCH"

            cd "$APP_DIR/backend"
            export HUSKY=0
            npm ci --include=dev

            set -a
            . "$APP_DIR/shared/backend.env"
            set +a

            npm run prisma:generate
            npm run prisma:migrate:deploy
            npm run build

            if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
              pm2 restart ecosystem.config.cjs --only "$PM2_APP_NAME" --env production --update-env
            else
              pm2 start ecosystem.config.cjs --only "$PM2_APP_NAME" --env production
            fi

            cd "$APP_DIR/web-app"
            export VITE_API_BASE_URL="$PUBLIC_API_BASE_URL"
            npm ci
            npm run build

            if pm2 describe "$WEB_PM2_APP_NAME" >/dev/null 2>&1; then
              pm2 delete "$WEB_PM2_APP_NAME"
            fi
            pm2 serve "$APP_DIR/web-app/dist" "$WEB_APP_PORT" --name "$WEB_PM2_APP_NAME" --spa

            cd "$APP_DIR/admin-panel"
            export VITE_API_BASE_URL="$PUBLIC_API_BASE_URL"
            npm ci
            npm run build

            if pm2 describe "$ADMIN_PM2_APP_NAME" >/dev/null 2>&1; then
              pm2 delete "$ADMIN_PM2_APP_NAME"
            fi
            pm2 serve "$APP_DIR/admin-panel/dist" "$ADMIN_PANEL_PORT" --name "$ADMIN_PM2_APP_NAME" --spa

            pm2 save

            HEALTH_PORT="${PORT:-4000}"
            curl -fsS "http://127.0.0.1:${HEALTH_PORT}/api/health" >/dev/null
            curl -fsS "http://127.0.0.1:${WEB_APP_PORT}/" >/dev/null
            curl -fsS "http://127.0.0.1:${ADMIN_PANEL_PORT}/" >/dev/null
