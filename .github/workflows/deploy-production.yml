name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy (no Docker)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Prepare frontend envs
        run: |
          printf "%s" "${{ secrets.WEB_APP_ENV_PROD }}" > web-app/.env
          printf "%s" "${{ secrets.ADMIN_PANEL_ENV_PROD }}" > admin-panel/.env

      - name: Build web app
        working-directory: web-app
        run: |
          npm ci
          npm run build

      - name: Build admin panel
        working-directory: admin-panel
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$PROD_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PROD_PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend source
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_BACKEND_DIR: ${{ secrets.PROD_BACKEND_DIR }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            -e "ssh -p $PROD_PORT" \
            backend/ "$PROD_USER@$PROD_HOST:$PROD_BACKEND_DIR/"

      - name: Upload backend env
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_BACKEND_DIR: ${{ secrets.PROD_BACKEND_DIR }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          BACKEND_ENV_PROD: ${{ secrets.BACKEND_ENV_PROD }}
        run: |
          printf "%s" "$BACKEND_ENV_PROD" | ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "cat > '$PROD_BACKEND_DIR/.env'"

      - name: Build and restart backend on server
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_BACKEND_DIR: ${{ secrets.PROD_BACKEND_DIR }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
        run: |
          ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" '
            set -e
            cd "'$PROD_BACKEND_DIR'"
            npm ci
            npm run prisma:generate
            npx prisma migrate deploy
            npm run build
            pm2 describe restaurant-backend >/dev/null 2>&1 && pm2 restart restaurant-backend --update-env || pm2 start dist/main.js --name restaurant-backend
            pm2 save
          '

      - name: Deploy web app static files
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_WEB_DIR: ${{ secrets.PROD_WEB_DIR }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
        run: |
          rsync -az --delete -e "ssh -p $PROD_PORT" web-app/dist/ "$PROD_USER@$PROD_HOST:$PROD_WEB_DIR/"

      - name: Deploy admin panel static files
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_ADMIN_DIR: ${{ secrets.PROD_ADMIN_DIR }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
        run: |
          rsync -az --delete -e "ssh -p $PROD_PORT" admin-panel/dist/ "$PROD_USER@$PROD_HOST:$PROD_ADMIN_DIR/"
