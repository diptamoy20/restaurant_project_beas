<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delivery Tracking Socket Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        line-height: 1.4;
        background: #f7f7f7;
        color: #111;
      }
      h1 {
        margin-top: 0;
      }
      .grid {
        display: grid;
        gap: 12px;
        max-width: 820px;
      }
      .row {
        display: grid;
        gap: 8px;
      }
      label {
        font-weight: 700;
      }
      input {
        padding: 10px 12px;
        font-size: 14px;
      }
      button {
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #status {
        padding: 10px 12px;
        background: #fff3cd;
        color: #664d03;
        border: 1px solid #ffecb5;
        border-radius: 6px;
      }
      #log {
        white-space: pre-wrap;
        background: #111;
        color: #d7fbd3;
        padding: 16px;
        min-height: 280px;
        overflow: auto;
        border-radius: 8px;
      }
      .hint {
        color: #444;
      }
    </style>
  </head>
  <body>
    <h1>Delivery Tracking Socket Test</h1>
    <p class="hint">
      Open in browser. This page loads Socket.IO client from your server at
      <code>http://localhost:4000/socket.io/socket.io.js</code>.
    </p>

    <div class="grid">
      <div class="row">
        <label for="host">Socket base URL</label>
        <input id="host" value="http://localhost:4000" />
      </div>

      <div class="row">
        <label for="token">Access token</label>
        <input id="token" placeholder="Paste JWT access token" />
      </div>

      <div class="row">
        <label for="orderId">Order ID</label>
        <input id="orderId" value="1025" />
      </div>

      <div class="row">
        <label for="latitude">Latitude</label>
        <input id="latitude" value="22.5726" />
      </div>

      <div class="row">
        <label for="longitude">Longitude</label>
        <input id="longitude" value="88.3639" />
      </div>

      <div class="row">
        <label for="speed">Speed (optional)</label>
        <input id="speed" value="22" />
      </div>

      <div class="row">
        <label for="heading">Heading (optional)</label>
        <input id="heading" value="135" />
      </div>

      <div class="actions">
        <button id="loadClient">1. Load Client</button>
        <button id="connect">2. Connect</button>
        <button id="join">3. Join Order</button>
        <button id="sendLocation">4. Send Location</button>
        <button id="disconnect">Disconnect</button>
        <button id="clearLog">Clear Log</button>
      </div>

      <div id="status">Idle</div>
      <div id="log"></div>
    </div>

    <script>
      let socket = null;
      let ioRef = null;
      let loadedClientBaseUrl = null;
      let clientScriptEl = null;

      const $ = (id) => document.getElementById(id);
      const logBox = $("log");
      const statusBox = $("status");

      function log(label, data) {
        const now = new Date().toISOString();
        const body =
          data === undefined
            ? ""
            : typeof data === "string"
              ? data
              : JSON.stringify(data, null, 2);
        logBox.textContent += `[${now}] ${label}${body ? "\n" + body : ""}\n\n`;
        logBox.scrollTop = logBox.scrollHeight;
      }

      function getBaseUrl() {
        return $("host").value.trim().replace(/\/+$/, "");
      }

      function setStatus(text, isError = false) {
        statusBox.textContent = text;
        statusBox.style.background = isError ? "#f8d7da" : "#d1e7dd";
        statusBox.style.color = isError ? "#842029" : "#0f5132";
        statusBox.style.borderColor = isError ? "#f5c2c7" : "#badbcc";
      }

      function getPayload() {
        return {
          orderId: Number($("orderId").value),
          latitude: Number($("latitude").value),
          longitude: Number($("longitude").value),
          speed: $("speed").value === "" ? undefined : Number($("speed").value),
          heading: $("heading").value === "" ? undefined : Number($("heading").value),
        };
      }

      function loadClientScript() {
        return new Promise((resolve, reject) => {
          const baseUrl = getBaseUrl();

          if (window.io && loadedClientBaseUrl === baseUrl) {
            ioRef = window.io;
            resolve();
            return;
          }

          if (clientScriptEl) {
            clientScriptEl.remove();
            clientScriptEl = null;
          }

          window.io = undefined;

          const script = document.createElement("script");
          script.src = `${baseUrl}/socket.io/socket.io.js`;
          script.onload = () => {
            ioRef = window.io;
            loadedClientBaseUrl = baseUrl;
            setStatus(`Client loaded from ${baseUrl}`);
            resolve();
          };
          script.onerror = () => {
            setStatus(`Failed to load client from ${baseUrl}`, true);
            reject(new Error(`Failed to load ${script.src}`));
          };
          clientScriptEl = script;
          document.head.appendChild(script);
        });
      }

      function bindSocketEvents() {
        socket.on("connect", () => {
          setStatus(`Socket connected: ${socket.id}`);
          log("connect", { id: socket.id });
        });
        socket.on("disconnect", (reason) => {
          setStatus(`Socket disconnected: ${reason}`, true);
          log("disconnect", { reason });
        });
        socket.on("connect_error", (error) => {
          setStatus(`Connect error: ${error?.message ?? String(error)}`, true);
          log("connect_error", error?.message ?? String(error));
        });
        socket.on("tracking:connected", (data) => {
          setStatus("Authenticated on delivery-tracking namespace");
          log("tracking:connected", data);
        });
        socket.on("tracking:snapshot", (data) => log("tracking:snapshot", data));
        socket.on("delivery:location:updated", (data) =>
          log("delivery:location:updated", data),
        );
        socket.on("tracking:error", (data) => {
          setStatus(`Tracking error: ${data?.message ?? "Unknown error"}`, true);
          log("tracking:error", data);
        });
      }

      $("loadClient").addEventListener("click", async () => {
        try {
          await loadClientScript();
          log("client_loaded", { from: `${getBaseUrl()}/socket.io/socket.io.js` });
        } catch (error) {
          log("client_load_failed", error.message);
        }
      });

      $("connect").addEventListener("click", async () => {
        try {
          if (!ioRef) {
            await loadClientScript();
          }

          if (socket) {
            socket.disconnect();
          }

          socket = ioRef(`${getBaseUrl()}/delivery-tracking`, {
            transports: ["websocket"],
            auth: {
              token: $("token").value.trim(),
            },
          });

          bindSocketEvents();
          setStatus(`Connecting to ${getBaseUrl()}/delivery-tracking`);
          log("connecting", { url: `${getBaseUrl()}/delivery-tracking` });
        } catch (error) {
          setStatus(`Connect setup failed: ${error.message}`, true);
          log("connect_setup_failed", error.message);
        }
      });

      $("join").addEventListener("click", () => {
        if (!socket) {
          log("join_failed", "Connect first");
          return;
        }

        const payload = { orderId: Number($("orderId").value) };
        socket.emit("track:join", payload);
        log("emit track:join", payload);
      });

      $("sendLocation").addEventListener("click", () => {
        if (!socket) {
          log("send_failed", "Connect first");
          return;
        }

        const payload = getPayload();
        socket.emit("delivery:location", payload);
        log("emit delivery:location", payload);
      });

      $("disconnect").addEventListener("click", () => {
        if (!socket) {
          log("disconnect_skipped", "No active socket");
          return;
        }

        socket.disconnect();
        socket = null;
      });

      $("clearLog").addEventListener("click", () => {
        logBox.textContent = "";
      });
    </script>
  </body>
</html>
